---
minor_changes:
  - Add read-only ``application_info``, ``runtemplate_info``, ``job_info``, ``user_info``, ``credential_info``, ``token_info``, ``eventsource_info``, ``eventrule_info`` and ``companyapp_info`` modules that list or fetch records through ``multiflexi-cli``, sharing the new ``module_utils/multiflexi_cli`` helper.
  - runtemplate - add ``auto_credentials`` and ``credential_requirements`` to assign credentials by the application's requirements (fails when a requirement has no or more than one matching credential).
  - company_info - now lists all companies when none of ``name``, ``slug`` or ``ic`` is given (it used to fail).
bugfixes:
  - company - fix the change detection for non-boolean parameters, which made the module report a change on every run.
  - runtemplate - only report a change and update ``config`` keys whose value differs from the stored one instead of always reporting a change.
major_changes:
  - Add the ``demo_showcase`` role that presents the installed applications on a demo instance and keeps it maintainable (modes seed, snapshot, reconcile, audit, reset, incident).
