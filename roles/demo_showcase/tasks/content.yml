---
# Idempotently (re)creates the showcase: companies, application assignments, run templates.
- name: List installed applications
  vitexus.multiflexi.application_info:
  register: demo_showcase_apps_result
  become: true

- name: Select presentable applications
  ansible.builtin.set_fact:
    demo_showcase_presented_apps: >-
      {{ demo_showcase_apps_result.applications
         | rejectattr('name', 'in', demo_showcase_app_name_skiplist)
         | selectattr('uuid', 'defined')
         | sort(attribute='name')
         | list }}

- name: Ensure showcase companies exist
  vitexus.multiflexi.company:
    state: present
    slug: "{{ item.slug }}"
    name: "{{ item.name }}"
    ic: "{{ item.ic | default(omit) }}"
    email: "{{ item.email | default(omit) }}"
  loop: "{{ demo_showcase_companies }}"
  loop_control:
    label: "{{ item.slug }}"
  become: true

- name: Look up company IDs
  vitexus.multiflexi.company_info:
  register: demo_showcase_company_list
  become: true

- name: Plan which applications are presented under which company
  ansible.builtin.set_fact:
    demo_showcase_plan: >-
      {%- set apps = demo_showcase_presented_apps -%}
      {%- set per = [demo_showcase_apps_per_company | int, apps | length] | min -%}
      {%- set ids = dict(demo_showcase_company_list.companies | map(attribute='slug') | zip(demo_showcase_company_list.companies | map(attribute='id'))) -%}
      {%- set out = [] -%}
      {%- for company in demo_showcase_companies if company.slug in ids -%}
        {%- set ci = loop.index0 -%}
        {%- for k in range(per) -%}
          {%- set app = apps[(ci * per + k) % (apps | length)] -%}
          {%- set _ = out.append({
                'company_slug': company.slug,
                'company_id': ids[company.slug],
                'company_name': company.name,
                'app_uuid': app.uuid,
                'app_name': app.name,
                'interv': demo_showcase_intervals[(ci + k) % (demo_showcase_intervals | length)]
              }) -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ out | to_json }}
  when: demo_showcase_presented_apps | length > 0

- name: Parse the plan
  ansible.builtin.set_fact:
    demo_showcase_plan: "{{ demo_showcase_plan | from_json }}"
  when: demo_showcase_plan is defined and demo_showcase_plan is string

- name: Assign applications to the showcase companies
  vitexus.multiflexi.companyapp:
    state: present
    company_id: "{{ item.company_id }}"
    app_uuid: "{{ item.app_uuid }}"
  loop: "{{ demo_showcase_plan | default([]) }}"
  loop_control:
    label: "{{ item.company_slug }} / {{ item.app_name }}"
  become: true

- name: Ensure run templates for the presented applications
  vitexus.multiflexi.runtemplate:
    state: present
    name: "{{ item.company_name }}: {{ item.app_name }}"
    app_uuid: "{{ item.app_uuid }}"
    company: "{{ item.company_slug }}"
    interv: "{{ item.interv }}"
    active: "{{ demo_showcase_runtemplates_active | bool }}"
  loop: "{{ demo_showcase_plan | default([]) }}"
  loop_control:
    label: "{{ item.company_slug }} / {{ item.app_name }}"
  become: true
